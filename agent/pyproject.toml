[project]
name = "placement-ai-agent"
version = "1.0.0"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "langchain-core>=0.3,<2", "langgraph>=0.4,<2", "pydantic>=2.10,<3", "python-multipart>=0.0.20", "pypdf>=5,<7", "python-docx>=1.1,<2", "httpx>=0.28,<1"]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3,<6", "faiss-cpu>=1.10,<2"]
voice = [
    "piper-tts==1.8.0",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
